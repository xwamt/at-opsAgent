id: pb.security-triage
version: 1
title: 安全事件初判
triggers:
  - kind: nl
    patterns: ["入侵", "异常登录", "挖矿", "凭据泄漏", "可疑进程"]
stages:
  - id: triage
    prompt: references/triage.md
  - id: selecting
    prompt: references/selecting.md
    select: { mode: replace, pluginIds: [at.terminal] }
  - id: investigating
    prompt: references/investigating.md
    parallelGroup:
      - id: inv-forensic
        role: investigator
        riskCeiling: read
        goal: 最小接触采集会话/进程树/外联/计划任务/认证日志元数据
  - id: synthesizing
    prompt: references/synthesizing.md
  - id: escalated
    prompt: references/escalated.md
  - id: reporting
    prompt: references/reporting.md
    artifact: security-triage
    parallelGroup:
      - id: writer
        role: writer
        allowTools: []
        riskCeiling: read
        goal: 产出 security-triage 工件
  - id: closed
