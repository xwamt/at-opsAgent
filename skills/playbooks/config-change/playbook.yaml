id: pb.config-change
version: 1
title: 配置变更
triggers:
  - kind: nl
    patterns: ["nacos", "配置中心", "dataid", "配置回滚"]
stages:
  - id: triage
  - id: selecting
    select: { mode: replace, pluginIds: [at.nacos] }
    escalateSelect: { mode: add, pluginIds: [at.grafana] }
  - id: investigating
    parallelGroup:
      - id: inv-config
        role: investigator
        riskCeiling: read
        goal: 列出命名空间/配置/历史/监听者，默认脱敏
  - id: synthesizing
  - id: guidedManual
    guidedManual:
      command: atNacos.publishConfig
      hint: 发布、删除、回滚、实例上下线在 AT Nacos 编辑器/树视图完成。
  - id: reporting
    artifact: operation-record
  - id: closed
