id: pb.release
version: 1
title: 发布与回滚
triggers:
  - kind: nl
    patterns: ["发布", "回滚", "构建失败", "jenkins", "pipeline"]
stages:
  - id: triage
    prompt: references/triage.md
  - id: selecting
    prompt: references/selecting.md
    select: { mode: replace, pluginIds: [at.jenkins] }
    escalateSelect: { mode: add, pluginIds: [at.terminal, at.grafana] }
  - id: investigating
    prompt: references/investigating.md
    parallelGroup:
      - id: inv-build
        role: investigator
        riskCeiling: read
        goal: 确认 job、构建号、制品 digest、失败日志尾部
  - id: synthesizing
    prompt: references/synthesizing.md
  - id: guidedManual
    prompt: references/guided-manual.md
    guidedManual:
      command: atJenkins.triggerBuild
      hint: MCP 不能触发构建。在 AT Jenkins 视图确认后点击触发/停止。
  - id: verifying
    prompt: references/verifying.md
  - id: reporting
    prompt: references/reporting.md
    artifact: service-deployment
  - id: closed
