id: pb.host-emergency
version: 1
title: 主机应急
triggers:
  - kind: nl
    patterns: ["主机", "SSH", "OOM", "disk full", "服务挂了", "load 高"]
stages:
  - id: triage
    prompt: references/triage.md
  - id: selecting
    prompt: references/selecting.md
    select: { mode: replace, pluginIds: [at.terminal] }
    escalateSelect: { mode: add, pluginIds: [at.jumpserver] }
  - id: investigating
    prompt: references/investigating.md
    parallelGroup:
      - id: inv-host
        role: investigator
        riskCeiling: read
        goal: uptime/free/ps/dmesg/journal 有界只读
  - id: synthesizing
    prompt: references/synthesizing.md
  - id: awaitingApproval
    prompt: references/approval.md
  - id: executing
    prompt: references/executing.md
  - id: verifying
    prompt: references/verifying.md
  - id: reporting
    prompt: references/reporting.md
    artifact: operation-record
    parallelGroup:
      - id: writer
        role: writer
        allowTools: []
        riskCeiling: read
        goal: 产出 operation-record 工件
  - id: closed
